openapi: 3.0.3
info:
  title: Orders API
  version: 1.2.0
paths:
  /orders:
    get:
      summary: List orders
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      summary: Create order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /orders/{order_id}:
    get:
      summary: Get order
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
    delete:
      summary: Cancel order
      responses:
        "204":
          description: Deleted
components:
  schemas:
    Order:
      type: object
      required: [id, email, total, status]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        total:
          type: number
          format: double
        status:
          type: string
          enum: [pending, paid, shipped, cancelled]
        currency:
          type: string
        coupon_code:
          type: string
    OrderCreate:
      type: object
      required: [email, total]
      properties:
        email:
          type: string
          format: email
        total:
          type: number
        currency:
          type: string
        coupon_code:
          type: string
