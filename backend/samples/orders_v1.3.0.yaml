openapi: 3.0.3
info:
  title: Orders API
  version: 1.3.0
paths:
  /orders:
    get:
      summary: List orders
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      summary: Create order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /orders/{order_id}:
    get:
      summary: Get order
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /orders/{order_id}/refunds:
    post:
      summary: Refund order (new)
      responses:
        "201":
          description: Created
components:
  schemas:
    Order:
      type: object
      required: [id, total, status, currency, payment_method]
      properties:
        id:
          type: string
          format: uuid
        total:
          type: integer
        status:
          type: string
          enum: [pending, paid, shipped, cancelled]
        currency:
          type: string
        payment_method:
          type: string
          enum: [card, bank, wallet]
    OrderCreate:
      type: object
      required: [email, total, currency, payment_method]
      properties:
        email:
          type: string
          format: email
        total:
          type: integer
        currency:
          type: string
        coupon_code:
          type: string
        payment_method:
          type: string
          enum: [card, bank, wallet]
        note:
          type: string
