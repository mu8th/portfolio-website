name: uptime

# Checks the live site and its demo API every 30 minutes. A failed run shows up
# in the Actions tab and GitHub emails the repository owner, so an Oracle VM that
# was reclaimed or a crashed service gets noticed before a recruiter does.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Page loads
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 20 https://muath.online/ -o /dev/null

      - name: Demo API is healthy
        run: |
          body=$(curl -fsS --retry 3 --retry-delay 10 --max-time 20 https://muath.online/api/health)
          echo "$body"
          echo "$body" | grep -q '"status":"ok"'
          # Every engine the demos depend on must be reachable.
          if echo "$body" | grep -q 'false'; then
            echo "::error::An engine is down: $body"
            exit 1
          fi

      - name: Demos answer
        run: |
          curl -fsS --max-time 30 https://muath.online/api/contract | grep -q '"breaking_count"'
          curl -fsS --max-time 30 https://muath.online/api/scan | grep -q '"recall"'
