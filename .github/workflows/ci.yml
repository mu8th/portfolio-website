name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The demo backend reuses the sibling projects' real code (performance-profiler's
      # profiler.py and vulnerability-scanner's scanner engine), so the tests need those
      # repos available. They are checked out under vendor/ and pointed to via
      # PORTFOLIO_SERVER_DIR, mirroring the local sibling-repo layout.
      - name: Check out performance-profiler (engine source)
        uses: actions/checkout@v4
        with:
          repository: mu8th/performance-profiler
          path: vendor/performance-profiler
          token: ${{ secrets.SIBLING_REPO_TOKEN }}

      - name: Check out vulnerability-scanner (engine source)
        uses: actions/checkout@v4
        with:
          repository: mu8th/vulnerability-scanner
          path: vendor/vulnerability-scanner
          token: ${{ secrets.SIBLING_REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.16.6

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        env:
          PORTFOLIO_SERVER_DIR: ${{ github.workspace }}/vendor
        # Scoped to backend/tests so the checked-out engine repos' own test
        # suites (under vendor/) are never collected.
        run: pytest -q backend/tests
