line-length = 100
target-version = "py311"
# The scanner demo's sample app is deliberately written with flawed patterns
# (string-built SQL, %-formatting) for the scanner to find; it is never run.
extend-exclude = ["backend/samples"]

[lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008", # FastAPI Depends() in argument defaults is the standard pattern
]
